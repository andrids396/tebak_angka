<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Angka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h3 class="judul">TEBAK ANGKA</h3>
        <p class="intruksi">Komputer sedang mimilih angka <strong>1 sampai 100 <br><span class="loadingMencariAngka">. . .</span></strong></p>
        <form id="formTebakan" class="formTebakan">
            <input type="text" id="inputAngka" class="inputAngka" placeholder="Masukan angka..." autocomplete="off">
            <button type="submit" id="tombolTebak" class="tombolTebak">Tebak</button>
        </form>
        <p id="keteranganTebakan" class="keteranganTebakan">Belum menebak!!!</p>
    </div>
</body>
<script src="scripe.js"></script>
</html>
